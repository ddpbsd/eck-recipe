---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: init-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: init-ca
  subject:
    organizations:
      - wafflelab
    organizationalUnits:
      - k8s
  secretName: init-ca-secret
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: self-signed-issuer
    kind: Issuer
    group: cert-manager.io
