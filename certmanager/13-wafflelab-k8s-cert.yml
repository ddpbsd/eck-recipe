---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: elasticsearch-k8s
  namespace: default
spec:
  secretName: elasticsearch-es-secret
  isCA: false
  commonName: elasticsearch.k8s.wafflelab.online
  subject:
    organizations:
      - wafflelab
    organizationalUnits:
      - k8s
  dnsNames:
    - elasticsearch.k8s.wafflelab.online
    - elasticsearch.wafflelab.net
    - elasticsearch.k8s.wafflelab.net
    - elasticsearch-es-http
    - elasticsearch-es-http.default.svc
    - elasticsearch-es-http.default.svc.cluster.local
  issuerRef:
    kind: ClusterIssuer
    name: wafflelab-ca
  usages:
    - server auth
    - client auth
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  duration: 8760h
  renewBefore: 7200h
