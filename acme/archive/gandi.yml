---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec: 
  acme:
    email: ddpbsd@gmail.com
    profile: tlsserver
    server: https://acme-staging-v02.api.letsencrypt.org/directory
  privateKeySecretRef:
    name: letsencrypt-staging
  solvers:
  - dns01:
      webhook:
        groupName: acme.wafflelab.net
        solverName: gandi
        config:
          patSecretRef:
            key: pat
            name: gandi-credentials
 
