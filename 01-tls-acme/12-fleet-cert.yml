---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fleet-hids-one
  namespace: default
spec:
  secretName: fleet-server-secret
  isCA: false
  commonName: fleet.hids.one
  subject:
    organizations:
      - elastic
    organizationalUnits:
      - hids.one
  dnsNames:
    - fleet.hids.one
  issuerRef:
    kind: ClusterIssuer
    name: hids-one-issuer
  usages:
    - server auth
    - client auth
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  duration: 8760h
  renewBefore: 7200h
